# Roda o pipeline inteiro (Stage → SOR → SOT → SPEC → portas) e os testes a cada push.
# O selo verde no README é a prova de que o projeto roda do zero, num ambiente limpo.
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Pipeline (gera, carrega, constrói as camadas e confere as portas)
        run: python -m src.pipeline
      - name: Testes (portas + idempotência)
        run: python -m unittest -v
      - name: Consulta de exemplo
        run: python -m src.consultar churn --md
